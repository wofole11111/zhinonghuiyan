name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip git zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install cython buildozer

      - name: Build APK
        run: |
          buildozer init
          # 修改配置
          sed -i 's/title = My Application/title = 智农慧眼/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = zhinonghuiyan/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.zhinong/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,Pillow/' buildozer.spec
          sed -i 's/# android.permissions =/android.permissions = CAMERA,INTERNET/' buildozer.spec
          sed -i 's/ orientation = landscape/ orientation = portrait/' buildozer.spec
          # 开始打包
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhinonghuiyan
          path: bin/*.apk
