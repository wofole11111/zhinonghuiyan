name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Buildozer
      run: |
        sudo apt update
        sudo apt install -y python3-pip git zip unzip openjdk-17-jdk
        pip install buildozer cython
    
    - name: Build APK
      run: |
        buildozer init
        sed -i 's/title = My Application/title = 智农慧眼/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = zhinonghuiyan/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.zhinong/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,Pillow/' buildozer.spec
        sed -i 's/# android.permissions =/android.permissions = CAMERA,INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE/' buildozer.spec
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: zhinonghuiyan
        path: bin/*.apk
