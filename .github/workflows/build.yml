name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y python3-pip git zip unzip openjdk-17-jdk
          pip install buildozer

      - name: Build APK
        run: |
          buildozer init
          sed -i 's/title = My Application/title = 智农慧眼/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = testapp/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.test/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
          sed -i 's/# android.permissions =/android.permissions = INTERNET/' buildozer.spec
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: testapp
          path: bin/*.apk
