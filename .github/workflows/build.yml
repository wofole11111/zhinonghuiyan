name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        run: |
          # 创建 buildozer.spec
          buildozer init
          
          # 修改配置
          sed -i 's/title = My Application/title = 智农慧眼/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = zhinonghuiyan/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.zhinong/' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,zip/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,Pillow==10.3.0/' buildozer.spec
          sed -i 's/ orientation = landscape/ orientation = portrait/' buildozer.spec
          sed -i 's/android.permissions = /android.permissions = CAMERA,INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE/' buildozer.spec
          
          # 打包
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhinonghuiyan
          path: bin/*.apk
